# 每周检查上游 omp 新版本，有更新时自动生成翻译缺口报告并开 issue。
name: upstream-check

on:
  schedule:
    - cron: "0 3 * * 1" # 每周一 03:00 UTC
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 查询 npm 最新版本
        id: latest
        run: |
          VER=$(npm view @oh-my-pi/pi-coding-agent version)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "上游最新版本: $VER"

      - name: 与基线比对
        id: cmp
        run: |
          BASE=$(bun -e 'const t=require("fs").readFileSync("translations/meta.jsonc","utf8");console.log(JSON.parse(t.replace(/^\s*\/\/.*$/gm,"")).baseVersion)')
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          if [ "$BASE" = "${{ steps.latest.outputs.version }}" ]; then
            echo "same=1" >> "$GITHUB_OUTPUT"
            echo "基线已是最新 ($BASE)"
          else
            echo "上游有新版本: $BASE -> ${{ steps.latest.outputs.version }}"
          fi

      - name: 生成缺口报告（对照新版本）
        if: steps.cmp.outputs.same != '1'
        run: |
          bun scripts/extract.ts --version "${{ steps.latest.outputs.version }}" --base "${{ steps.cmp.outputs.base }}" || true
          cp .tmp/extract-report-*.json .tmp/report.json

      - name: 开/更新 issue
        if: steps.cmp.outputs.same != '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('.tmp/report.json', 'utf8'));
            const title = `上游 omp ${report.targetVersion} 已发布（基线 ${report.baseVersion}）——翻译缺口报告`;
            const byFile = (list) => {
              const m = new Map();
              for (const x of list) m.set(x.file, (m.get(x.file) ?? 0) + 1);
              return [...m].sort((a, b) => b[1] - a[1]).slice(0, 15)
                .map(([f, n]) => `| ${f} | ${n} |`).join('\n');
            };
            const body = [
              `上游 [oh-my-pi](https://github.com/can1357/oh-my-pi) 发布了新版本 **${report.targetVersion}**，当前翻译基线为 \`${report.baseVersion}\`。`,
              '',
              '## 缺口概览',
              '',
              '| 类别 | 数量 |',
              '|---|---|',
              `| A. 失效条目（原文已不存在） | ${report.staleCount} |`,
              `| B. 漂移串（曾被翻译、原文已变） | ${report.driftCount} |`,
              `| C. 新增未译（字段启发式） | ${report.freshCount} |`,
              '',
              report.staleCount + report.driftCount + report.freshCount === 0
                ? '✅ 无缺口——只需把 `translations/meta.jsonc` 的 `baseVersion` 更新为最新版并提交。'
                : '请运行 `bun scripts/extract.ts --version ' + report.targetVersion + '` 查看明细，按 B → C → A 优先级更新 `translations/*.jsonc`。',
              '',
              '### A. 失效条目 Top 文件',
              '| 文件 | 条数 |', byFile(report.stale), '',
              '### B. 漂移串 Top 文件',
              '| 文件 | 条数 |', byFile(report.drifted), '',
              '### C. 新增未译 Top 文件',
              '| 文件 | 条数 |', byFile(report.fresh), '',
              '',
              `_报告生成于 ${report.generatedAt}，完整明细见 workflow artifacts。_`,
            ].join('\n');
            // 找已有 issue，避免重复开
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'upstream-update', per_page: 10,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, title, body,
              });
              console.log('已更新 issue #' + existing.data[0].number);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['upstream-update'],
              });
              console.log('已创建 issue');
            }

      - name: 上传完整报告
        if: steps.cmp.outputs.same != '1'
        uses: actions/upload-artifact@v4
        with:
          name: extract-report-${{ steps.latest.outputs.version }}
          path: .tmp/report.json
